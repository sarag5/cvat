# Kubernetes Secret holding the Azure Entra ID (Azure AD) SSO credentials.
#
# DO NOT commit real values. Copy this file, fill in the values, and apply it:
#
#   cp k8s/sso/cvat-sso-secret.example.yaml /tmp/cvat-sso-secret.yaml
#   # edit /tmp/cvat-sso-secret.yaml
#   kubectl -n cvat apply -f /tmp/cvat-sso-secret.yaml
#
# stringData lets you paste the plain values; Kubernetes base64-encodes them.
apiVersion: v1
kind: Secret
metadata:
  name: cvat-sso
  namespace: cvat
type: Opaque
stringData:
  # Directory (tenant) ID of your Entra ID tenant.
  tenant_id: "00000000-0000-0000-0000-000000000000"
  # Application (client) ID of the CVAT app registration.
  client_id: "11111111-1111-1111-1111-111111111111"
  # A client secret VALUE created under "Certificates & secrets".
  client_secret: "REPLACE_WITH_CLIENT_SECRET_VALUE"
